LoadModule dav_svn_module /usr/lib/apache2/mod_dav_svn.so
ServerName localhost
<Location /svn>
  DAV svn
  SVNParentPath /srv/svn
  # Anonymous read only, like the real servers.
  <LimitExcept GET PROPFIND OPTIONS REPORT>
    Require all denied
  </LimitExcept>
</Location>
Alias /expected /srv/expected
<Directory /srv/expected>
  Require all granted
</Directory>
